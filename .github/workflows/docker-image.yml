name: Build & Push Image

on:
  release:
    types: [published]

jobs:
  check:
    name: Check requirements
    runs-on: ubuntu-latest
    outputs:
      continue: ${{ steps.check.outputs.continue }}

    steps:
      - name: Check release target
        id: check
        env:
          TARGET: ${{ github.event.release.target_commitish }}
        run: |
          set -euo pipefail

          if [ "$TARGET" != "main" ]; then
            echo "Detected non-main release target '$TARGET'. Skipping..."
            echo "continue=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Release targets main. Continuing..."
          echo "continue=true" >> "$GITHUB_OUTPUT"

  update:
    needs: check
    if: needs.check.outputs.continue == 'true'
    runs-on: ubuntu-latest
    name: Image

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: codeshelldev/gh-actions/docker-build-push@v1
        with:
          registry: ghcr.io
          token: ${{ secrets.GITHUB_TOKEN }}
